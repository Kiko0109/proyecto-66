<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0066ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#030712"/>
  <circle cx="256" cy="256" r="230" fill="url(#neonGlow)"/>

  <!-- Outer Tech Hexagon / Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="#050c1e" stroke="#00f0ff" stroke-width="4" filter="url(#glow)"/>

  <!-- Tech crosshairs & markers -->
  <line x1="256" y1="20" x2="256" y2="54" stroke="#00f0ff" stroke-width="3"/>
  <line x1="256" y1="458" x2="256" y2="492" stroke="#00f0ff" stroke-width="3"/>
  <line x1="20" y1="256" x2="54" y2="256" stroke="#00f0ff" stroke-width="3"/>
  <line x1="458" y1="256" x2="492" y2="256" stroke="#00f0ff" stroke-width="3"/>

  <!-- 66 Symbol -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="-6" filter="url(#glow)">66</text>
  
  <!-- Subtitle P-66 -->
  <text x="256" y="345" font-family="monospace" font-weight="700" font-size="20" fill="#00f0ff" text-anchor="middle" letter-spacing="6" opacity="0.9">PROYECTO</text>
  <circle cx="256" cy="145" r="8" fill="#00f0ff" filter="url(#glow)"/>
</svg>
